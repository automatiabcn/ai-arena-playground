name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# There is no test suite yet. CI verifies the lockfile installs cleanly (the
# Prisma client is generated by the postinstall hook, no DB needed) and that the
# Prisma schema is valid. `next build`/`next lint` need runtime env and a
# verified-clean baseline; wire them in once the app has a CI-friendly setup.
jobs:
  install-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma validate
