name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# There is no test suite yet. CI verifies the lockfile installs cleanly (the
# Prisma client is generated by the postinstall hook) and that the Prisma schema
# is valid. A dummy DATABASE_URL is provided because `prisma validate` resolves
# env() in the schema; no real database is contacted.
env:
  DATABASE_URL: "file:./ci.db"

jobs:
  install-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma validate
